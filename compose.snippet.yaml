services:
  prowlarr-adapter:
    build: ./prowlarr-torznab-adapter
    container_name: agent-prowlarr-adapter
    restart: unless-stopped
    depends_on:
      - prowlarr
    environment:
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      ADAPTER_API_KEY: ${ADAPTER_API_KEY}
      PROWLARR_TIMEOUT_SECONDS: "30"
      MAX_RESULTS: "200"
    networks:
      - agent-core
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
